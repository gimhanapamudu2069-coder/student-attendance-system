{%extends 'based.html'%}
{%block title%}Attendence Records{%endblock%}
{%block content%}
<h1>Student Records</h1>

<table border="2">

    <tr>
        <th>ID</th>
        <th>Student ID</th>
        <th>Name</th>
        <th>Attendance Count</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.id }}</td>
        <td>{{ student.student_id }}</td>
        <td>{{ student.student_name }}</td>
        <td>{{ student.attendance }}</td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="/">Back</a>
{%endblock%}
